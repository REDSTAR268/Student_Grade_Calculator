<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <button type="button" id="theme-toggle">
        🌙 Dark Mode
    </button>

    <h1>Student Grade Calculator</h1>

    <p>Enter your name and your five subject scores.</p>

    <form id="grade-form" novalidate>

        <label for="student-name">Student Name:</label>
        <input type="text" id="student-name" placeholder="Enter your name">

        <h2>Subject Scores</h2>

        <label for="math">Mathematics:</label>
        <input type="number" id="math" min="0" max="100">

        <label for="english">English:</label>
        <input type="number" id="english" min="0" max="100">

        <label for="science">Science:</label>
        <input type="number" id="science" min="0" max="100">

        <label for="computer">Computer Studies:</label>
        <input type="number" id="computer" min="0" max="100">

        <label for="social-studies">Social Studies:</label>
        <input type="number" id="social-studies" min="0" max="100">

        <button type="submit">Calculate Grade</button>
        <button type="reset">Reset</button>
        
    </form>


    <h2>Results</h2>

    <div id="results">
        <p id="result-name">Student Name: </p>
        <p id="result-total">Total Score: </p>
        <p id="result-average">Average Score: </p>
        <p id="result-highest">Highest Score: </p>
        <p id="result-lowest">Lowest Score: </p>
        <p id="result-grade">Letter Grade: </p>
        <p id="result-status">Pass/Fail: </p>
        <p id="result-message">Message: </p>
    </div>


</body>
</html>
